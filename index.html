<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catch The Heart 💖</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="snakeCanvas"></canvas>


<!-- ================= GAME SCREEN ================= -->
<div class="screen active" id="game">
  <div class="decor" id="decor-game"></div>
  <div id="instruction">Press the cursor or your finger to eat the green heart 💚</div>
  <div id="encourage">You can do it, bae 💕</div>
  <div id="heart">💚</div>

  <div id="tired-overlay">
    <div class="dialog">
      <p>Are you tired, bae? 💖</p>
      <div class="btn-row">
        <button class="btn" id="tired-yes">Yes 💖</button>
        <button class="btn secondary" id="tired-no">No 💪</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= QUIZ SCREEN ================= -->
<div class="screen" id="quiz">
  <div class="decor light-decor" id="decor-quiz"></div>
  <div class="center-box">
    <h2>How old will you be on September 23, 2028? 💭</h2>
    <input type="text" id="quiz-input" placeholder="xx years xx months xx days" autocomplete="off">
    <div id="feedback"></div>
    <button class="btn" id="quiz-submit">Submit 💌</button>
    <button class="btn secondary" id="quiz-retry" style="display:none;">Try Again</button>
  </div>
</div>

<!-- ================= SUCCESS SCREEN ================= -->
<div class="screen" id="success">
  <div class="decor light-decor" id="decor-success"></div>
  <div class="center-box">
    <h2>Wow, you did it bae! 🎉💖</h2>
    <div class="cake-wrap" id="cake-wrap">
      <div id="flame"></div>
      <div id="candle"></div>
      <div id="cream-upper"></div>
      <div id="cream-lower"></div>
      <div class="layer" id="layer4"></div>
      <div class="layer" id="layer3"></div>
      <div class="layer" id="layer2"></div>
      <div class="layer" id="layer1"></div>
    </div>
    <button class="btn" id="gift-btn">Open your gift 🎁</button>
  </div>
</div>

<!-- ================= BIRTHDAY / BOOK SCREEN ================= -->
<div class="screen" id="birthday">
  <div id="rain-layer"></div>
  <div class="center-box">

    <div class="envelope-row" id="cards-top">
      <div class="envelope" data-icon="💌" data-msg="You make every day feel like a celebration. Happy Birthday, my love! I'm so lucky to have you. 💖">💌<span>For you</span></div>
      <div class="envelope" data-icon="💕" data-msg="I fall for you a little more every single day. Here's to many more birthdays together, my love. 🌸">💕<span>Open me</span></div>
    </div>

    <h1 class="bday-title">
      <span class="word" style="animation-delay:0s">Happy</span>
      <span class="word" style="animation-delay:.6s">Birthday</span>
      <span class="word" style="animation-delay:1.2s">my</span>
      <span class="word" style="animation-delay:1.8s">love</span>
    </h1>

    <div class="book-preview" id="book-preview">
      📖<span>Tap to open your storybook</span>
    </div>

    <div class="envelope-row" id="cards-bottom">
      <div class="envelope" data-icon="🎁" data-msg="You are my favorite person, today and always. May this year bring you as much joy as you bring me. 💝">🎁<span>A little note</span></div>
      <div class="envelope" data-icon="🎂" data-msg="Forever grateful you're mine. Here's to another year of your smile lighting up my whole world. 🌷">🎂<span>Surprise</span></div>
    </div>

    <!-- big pop-up flip-book, opened by tapping the preview above -->
    <div class="book-overlay" id="book-overlay">
      <div class="book-modal" id="book-modal">
        <button class="card-close" id="book-close">✕</button>
        <div class="book" id="book"><!-- pages are generated by script.js from the photoUrls array --></div>
        <div class="btn-row book-nav" style="margin-top:14px;">
          <button class="btn secondary" id="prev-page">‹ Prev</button>
          <button class="btn" id="next-page">Next ›</button>
        </div>
      </div>
    </div>
  </div>

  <!-- expanding message card overlay -->
  <div class="card-overlay" id="card-overlay">
    <div class="card-modal" id="card-modal">
      <button class="card-close" id="card-close">✕</button>
      <div class="card-modal-icon">💖</div>
      <p id="card-modal-text"></p>
    </div>
  </div>
</div>


<script src="script.js"></script>
</body>
</html>
